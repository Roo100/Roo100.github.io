.imageframe,.casePhoto{position:relative}.imgcredit{position:absolute;top:7px;right:8px;padding:4px 6px;background:#132438e6;color:#fff6e6;letter-spacing:.04em;font-size:9px;font-weight:700;border-radius:3px;z-index:1;pointer-events:none}.casePhoto .imgcredit{top:6px;right:6px}.imageframe{overflow:hidden}#aux p{margin:10px 0 15px}#aux p b{color:#202D43}.reveal.compact{grid-template-columns:31% 1fr}.citation.inline{margin-top:16px}</style><meta content="Shelley (2020) class presentation with real contextual photographs licensed by Wikimedia Commons contributors." name="description"/></head><body><div class="shell"><div class="top"><div><strong>Illicit Trade and Terrorism</strong><small>Louise I. Shelley (2020) · ICJ 706</small></div><span class="tag">Raven Leigertwood</span></div><div class="toolbar"><div class="controls"><button class="btn" id="prev">← Previous</button><button class="btn dark" id="next">Next →</button><select aria-label="Jump to slide" class="select" id="slideSelect"></select></div><div class="controls"><span class="count" id="count"></span><button class="btn" id="full">Fullscreen</button></div></div><main aria-label="Interactive presentation slide" class="stage" id="stage"><div style="padding:40px;color:#202D43;font:20px Georgia,serif">Loading presentation…</div></main><noscript><p style="padding:18px;background:#fff">This presentation requires JavaScript.</p></noscript></div><script id="APPDATA" type="application/json">{"title":"Illicit Trade and Terrorism: Beyond Revenue Generation","author":"Raven Leigertwood","class":"ICJ 706","ref":"Shelley, L. I. (2020). Illicit trade and terrorism. Perspectives on Terrorism, 14(4), 7–20. https://www.jstor.org/stable/26927661","slides":[{"n":1,"title":"Illicit Trade and Terrorism","kicker":"BEYOND REVENUE GENERATION","type":"cover","subtitle":"Why terrorist participation in illicit trade cannot be explained solely through financial gain.","quote":"Terrorist participation in illicit trade is not only about revenue generation. It serves many functions: destruction of history, demoralization of communities, the weakening of social solidarity, and harms individuals’ health and well-being.","qp":"7","claims":["Financial resources support operations.","The same activity may produce cultural and social harm."],"cite":"Shelley, 2020, p. 7","imagekeys":["cover"]},{"n":2,"title":"Illicit Markets and Terrorist Operations","kicker":"RESEARCH DESIGN & PURPOSE","type":"modes","intro":"The article explains how terrorist organizations acquire resources through illicit commercial activity and critiques gaps in international policy.","quote":"Terrorists manage illicit trade operations in ways that are not dissimilar from transnational criminals with whom they often interact.","qp":"11","modes":[{"label":"Purpose & scope","heading":"Beyond financing","body":"Shelley examines how terrorist groups use illicit trade to generate revenue and pursue nonfinancial objectives, including social and cultural harm.","cite":"Shelley, 2020, pp. 7–10"},{"label":"Research focus","heading":"Questions inferred from the article","body":"How do terrorist organizations use illicit trade? Which commercial relationships sustain their operations? What do existing international policies recognize or overlook? The article does not state formal hypotheses.","cite":"Shelley, 2020, pp. 7–12"},{"label":"Research approach","heading":"Explanatory analysis with policy critique","body":"Recognizing illicit markets as sources of terrorist financing does not establish that international policies adequately address the activities supporting them. Shelley’s documented cases explain how these operations function, while her examination of United Nations resolutions identifies gaps in the criminal activities they recognize.","cite":"Shelley, 2020, pp. 8–12"},{"label":"Evidence & limits","heading":"Qualitative documentary comparison","body":"Evidence includes UN resolutions, government investigations, prior research, and reported cases. The inferred units of analysis are documented instances of terrorist involvement, examined through organizations, commodities, and commercial relationships. There is no formally specified sample or statistical test.","cite":"Shelley, 2020, pp. 7–12"}],"imagekeys":["un"]},{"n":3,"title":"What Makes Trade Illicit?","kicker":"CONCEPTS & DEFINITIONS","type":"cases","intro":"The commodity may be ordinarily legal. Illicit activity depends on the circumstances in which it is acquired, traded, or transported.","quote":"they often traffic in some normally licit commodities such as oil, gold, minerals, and pharmaceuticals.","qp":"11","cases":[{"label":"Oil · ISIS","heading":"Oil is not inherently illicit.","body":"ISIS used existing routes to move oil without authorization. The activity becomes illicit through the group’s control of resources and unlawful trade.","cite":"Shelley, 2020, pp. 8, 11","tag":"Iraq / Syria"},{"label":"Gold · FARC","heading":"A legal commodity can finance an armed group.","body":"FARC benefited from illegal gold mining in Colombia. The commodity alone does not identify the circumstances of extraction or trade.","cite":"Shelley, 2020, pp. 8, 11","tag":"Colombia"},{"label":"Antiquities · ISIS","heading":"Provenance and removal are central.","body":"ISIS-linked antiquities looting removed objects from their original context while generating revenue and damaging cultural heritage.","cite":"Shelley, 2020, pp. 7, 10","tag":"Iraq / Syria"}],"imagekeys":["oil","gold","anti"]},{"n":4,"title":"When Crime Serves Two Purposes","kicker":"SOCIAL HARM & ORGANIZATIONAL OBJECTIVES","type":"cases","intro":"Financial proceeds and political or social consequences may coexist in the same criminal activity.","quote":"It causes social harm and possibly helps traffickers achieve political objectives.","qp":"10","cases":[{"label":"ISIS · Antiquities","heading":"Revenue and cultural destruction","body":"The sale of looted antiquities generated funds while removing objects associated with a past the organization rejected.","cite":"Shelley, 2020, p. 10","tag":"Cultural heritage"},{"label":"ISIS · Yazidi trafficking","heading":"Revenue and community harm","body":"The enslavement and sale of Yazidi women generated revenue while inflicting sexual violence and severe harm on Yazidi communities.","cite":"Shelley, 2020, p. 10","tag":"Human trafficking"}],"imagekeys":["heritage","yazidi"]},{"n":5,"title":"Diversification as a Commercial Strategy","kicker":"MARKETS & OPPORTUNITY","type":"cases","intro":"The opportunity to profit depends on commercial access, partnerships, and exposure to enforcement—not the commodity alone.","quote":"Terrorists focus on many forms of illicit trade with high returns and low risk.","qp":"8","cases":[{"label":"FARC · Gold","heading":"Alternative revenue source","body":"Illegal gold mining became a major revenue source for FARC, at one point generating more than its drug trade.","cite":"Shelley, 2020, pp. 7–8, 11","tag":"Mineral extraction"},{"label":"ISIS · Oil","heading":"Existing trade routes","body":"ISIS used established smuggling routes to move oil, exploiting infrastructure that preceded the organization.","cite":"Shelley, 2020, p. 8","tag":"Energy trade"},{"label":"Burkina Faso · Medicine","heading":"Local criminal partnerships","body":"Terrorists worked with local criminal groups to trade a medicine used to treat seizures. This illustrates a different form of access to illicit markets.","cite":"Shelley, 2020, p. 11","tag":"Pharmaceuticals"}],"imagekeys":["farc","isis_oil","pharma"]},{"n":6,"title":"Who Facilitates Illicit Trade?","kicker":"COMMERCIAL NETWORKS & KNOWLEDGE","type":"cases","intro":"Moving illicit goods often requires access to otherwise legitimate transport, finance, and business services.","quote":"Effective supply chains for terrorists often require them to intersect with the legitimate economy.","qp":"12","cases":[{"label":"Concealed shipments","heading":"Legitimate vehicles, illicit cargo","body":"Weapons destined for Boko Haram were concealed in trailers and trucks transporting food items through the region.","cite":"Shelley, 2020, p. 12","tag":"Transport"},{"label":"Knowing participation","heading":"Commercial resources used knowingly","body":"A Nigerian transportation business owner reportedly confessed to using business proceeds and vehicles to support Boko Haram.","cite":"Shelley, 2020, p. 12","tag":"Intentional facilitator"},{"label":"Unwitting vendors","heading":"Access does not establish culpability","body":"Front and shell companies can conceal terrorist clients from legitimate businesses involved in moving goods.","cite":"Shelley, 2020, p. 12","tag":"Knowledge not established"}],"imagekeys":["truck"]},{"n":7,"title":"What Does Shelley’s Evidence Establish?","kicker":"CRITICAL ASSESSMENT","type":"assessment","intro":"Documented cases explain how illicit operations may function. They do not necessarily establish intent, prevalence, or the effects of intervention.","quote":"There is no standard definition of illicit trade.","qp":"9","cases":[{"label":"Policy evidence","heading":"Recognition does not measure effectiveness.","evidence":"United Nations resolutions recognize relationships between illicit trade and terrorism, but the activities covered differ.","body":"Recognition of particular illicit markets does not establish how frequently terrorist organizations participate in them or whether existing policies disrupt those activities.","cite":"Shelley, 2020, pp. 8–12"},{"label":"Documented cases","heading":"Consequences do not independently establish intent.","evidence":"Boko Haram’s abduction of the Chibok schoolgirls involved exploitation and demoralized their community.","body":"I agree that criminal activity may serve purposes beyond financial gain. However, the consequences of an offense do not establish the intentions of every participant.","cite":"Shelley, 2020, p. 10"},{"label":"Market comparisons","heading":"Diversification does not necessarily mean substitution.","evidence":"Shelley reports that illegal gold mining generated substantial revenue for FARC, exceeding drug revenue at a particular time.","body":"I would examine changes in revenue over time to distinguish replacement of an existing market from continued participation in multiple markets.","cite":"Shelley, 2020, pp. 8, 11"},{"label":"Civilian impacts","heading":"Disrupting revenue may also affect civilian access.","evidence":"Shelley recognizes that illicit trade in conflict zones may supply goods needed by communities under terrorist control.","body":"Community dependence does not establish support for an organization. The consequences of disrupting those markets for civilian access require further examination.","cite":"Shelley, 2020, p. 11"}],"imagekeys":[]},{"n":8,"title":"Disrupting Illicit Trade","kicker":"POLICY IMPLICATIONS","type":"modes","intro":"Prevention depends on identifying the commercial arrangements that permit illicit activity rather than focusing exclusively on offenders.","quote":"It requires a whole-of-society approach, including business, civil society, and researchers.","qp":"15","modes":[{"label":"Supply chains","heading":"Identify anomalies in trade","body":"Strengthen documentation, shipment transparency, and reporting beyond financial institutions to detect suspicious trade.","cite":"Shelley, 2020, p. 14"},{"label":"Beneficial ownership","heading":"Identify who controls companies","body":"Greater transparency can clarify who stands behind accounts and businesses that facilitate trade.","cite":"Shelley, 2020, p. 14"},{"label":"Digital markets","heading":"Extend oversight online","body":"Electronic financial services and social platforms may facilitate illicit transactions even when their existing monitoring targets recruitment.","cite":"Shelley, 2020, p. 15"}],"imagekeys":["customs"]},{"n":9,"title":"Beyond Disrupting Illicit Markets","kicker":"CONCLUSION","type":"conclusion","intro":"Preventing illicit trade also requires examining why communities become dependent on criminal organizations.","body":"Providing essential resources may reduce that dependence, but Shelley’s evidence does not establish whether these interventions reduce participation in illicit markets.","quote":"so that they do not turn to terrorists and criminals to have those needs met.","qp":"15","imagekeys":["ruins"]}],"image_credit":"Photographs: sourced from Wikimedia Commons. All photographs are contextual images, not documentary evidence of the specific offenses or organizations in Shelley (2020).","images":{},"staticSlides":{}}</script><script id="ASSETS" type="application/json">{"cover":"https://commons.wikimedia.org/wiki/Special:FilePath/Assyrian%20relief%20panel%20from%20883-859%20BCE.jpg?width=1000","un":"https://commons.wikimedia.org/wiki/Special:FilePath/United%20Nations%20Headquarters%20-%20Security%20Council%20chamber%2C%20straight-on%20view.jpg?width=1000","oil":"https://commons.wikimedia.org/wiki/Special:FilePath/USMC-081010-M-3455C-003.jpg?width=1000","gold":"https://commons.wikimedia.org/wiki/Special:FilePath/Minero%20de%20San%20Roque%2C%20Huila%2C%20Colombia.jpg?width=1000","anti":"https://commons.wikimedia.org/wiki/Special:FilePath/Assyrian%20relief%20panel%20from%20883-859%20BCE.jpg?width=1000","heritage":"https://commons.wikimedia.org/wiki/Special:FilePath/Ancient%20Palmyra.jpg?width=1000","yazidi":"https://commons.wikimedia.org/wiki/Special:FilePath/View%20of%20Shrines%20of%20Sheikh%20Adi%2C%20Sheikh%20Hassan%2C%20and%20Sheikh%20Bakr%20at%20the%20Yezidi%20holy%20site%20of%20Lalish%20in%20Kurdistan%20Region.jpg?width=1000","farc":"https://commons.wikimedia.org/wiki/Special:FilePath/Minero%20de%20San%20Roque%2C%20Huila%2C%20Colombia.jpg?width=1000","isis_oil":"https://commons.wikimedia.org/wiki/Special:FilePath/USMC-081010-M-3455C-003.jpg?width=1000","pharma":"https://commons.wikimedia.org/wiki/Special:FilePath/Medications%20at%20a%20grocery%20store.jpg?width=1000","truck":"https://commons.wikimedia.org/wiki/Special:FilePath/Big%20truck%20for%20transportation%20of%20goods%20in%20Nigeria.jpg?width=1000","customs":"https://commons.wikimedia.org/wiki/Special:FilePath/Port%20of%20Baltimore%20Outbound%20Inspections%20-%2053150714746.jpg?width=1000","ruins":"https://commons.wikimedia.org/wiki/Special:FilePath/Ancient%20Palmyra.jpg?width=1000"}</script><script>
const D=JSON.parse(document.getElementById('APPDATA').textContent);
const IM=JSON.parse(document.getElementById('ASSETS').textContent);
const PHOTO_CREDIT={"cover": "The Metropolitan Museum of Art · CC0", "un": "Jdforrester · CC BY 4.0", "oil": "Cpl. Shawn Coolman / USMC · Public domain", "gold": "Alliance for Responsible Mining · CC BY 4.0", "anti": "The Metropolitan Museum of Art · CC0", "heritage": "Wurzelgnohm · CC0", "yazidi": "Levi Clancy · CC BY-SA 4.0", "farc": "Alliance for Responsible Mining · CC BY 4.0", "isis_oil": "Cpl. Shawn Coolman / USMC · Public domain", "pharma": "Tessa Bury · CC BY 4.0", "truck": "Osezele Favour Eboseyi · CC BY-SA 4.0", "customs": "CBP / Anthony Guas · Public domain", "ruins": "Wurzelgnohm · CC0"};
const PHOTO_ALT={"cover": "Assyrian relief photographed by the Metropolitan Museum of Art", "un": "United Nations Security Council chamber", "oil": "Iraqi oil facility in Haqlaniyah in 2008", "gold": "Small-scale Colombian gold miner", "anti": "Assyrian relief from Nimrud", "heritage": "Ancient ruins at Palmyra, Syria", "yazidi": "Lalish shrine, Yazidi holy site in Iraq", "farc": "Small-scale gold mine in Colombia", "isis_oil": "Iraqi oil facility in Haqlaniyah", "pharma": "Medicine products on store pharmacy shelves", "truck": "Freight truck transporting goods in Nigeria", "customs": "U.S. Customs and Border Protection cargo inspection", "ruins": "Ancient ruins at Palmyra, Syria"};
const slides=D.slides;
let slideIndex=0;
const chosen={};
let assessmentMode='body';
const $=id=>document.getElementById(id);
const escapeHtml=(s)=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function img(k){return IM[k]||'';}
function credit(k){return escapeHtml(PHOTO_CREDIT[k]||'Wikimedia Commons');}
function photoAlt(k){return escapeHtml(PHOTO_ALT[k]||'Contextual photograph');}
function quoteBand(s){return s.quote?`<div class="quote">“${escapeHtml(s.quote)}”</div><div class="qsource">Shelley (2020, p. ${escapeHtml(s.qp)})</div>`:'';}
function base(s,inner){return `<div class="slidebar"><span>JOHN JAY COLLEGE OF CRIMINAL JUSTICE · ICJ 706</span><span>${String(s.n).padStart(2,'0')} / 09</span></div><div class="slidebody"><div><div class="label">${escapeHtml(s.kicker||'ICJ 706')}</div><h2 class="title">${escapeHtml(s.title)}</h2><div class="introline">${escapeHtml(s.intro||s.subtitle||'')}</div><div class="rule"></div></div>${inner}</div><div class="slidefoot"><span>RAVEN LEIGERTWOOD</span><span>ILLICIT TRADE AND TERRORISM</span></div>`;}
function imageCards(s,cards){let imKeys=s.imagekeys||[];
return `<div class="photoGrid ${cards.length===2?'two':''}">${cards.map((c,i)=>`<button class="casePhoto" type="button" data-index="${i}" aria-pressed="${(chosen[s.n]||0)===i}" onclick="choose(${i})"><img src="${img(imKeys[i]||imKeys[0])}" alt="${photoAlt(imKeys[i]||imKeys[0])}"/><span class="imgcredit">${credit(imKeys[i]||imKeys[0])}</span><span class="caseCap"><strong>${escapeHtml(c.label)}</strong></span></button>`).join('')}</div>`}
function tiles(s,cards,vert=false){return `<div class="textGrid ${cards.length===4?'four':''}">${cards.map((c,i)=>`<button class="textTile" type="button" data-index="${i}" aria-pressed="${(chosen[s.n]||0)===i}" onclick="choose(${i})"><strong>${escapeHtml(c.label)}</strong></button>`).join('')}</div>`;}
function content(s){let cards=s.cases||s.modes||[];let i=chosen[s.n]||0;return cards[i]||{};}
function reveal(s){
  const c=content(s),isAssessment=s.type==='assessment';
  const body=isAssessment?c[assessmentMode]:c.body;
  const extra=isAssessment?(assessmentMode==='body'?'My assessment':'Shelley’s evidence'):'Case context';
  const hasQualifier=Boolean(isAssessment || c.tag);
  const aside=hasQualifier?`<div class="qual"><b>${escapeHtml(extra)}</b>${escapeHtml(c.tag||'')}<div class="citation">${escapeHtml(c.cite||'')}</div></div>`:'';
  const citation=hasQualifier?'':`<div class="citation inline">${escapeHtml(c.cite||'')}</div>`;
  return `<div class="reveal ${hasQualifier?'':'compact'}" id="dynamic"><h3>${escapeHtml(c.heading||c.label||'')}</h3><div class="bodytxt">${escapeHtml(body||'')}${citation}</div>${aside}</div>`;
}
function staticSlide(s){let k=s.imagekeys?.[0];let claim=s.claims?.[0]||s.body||s.subtitle||'';return base(s,`<div class="static"><div class="image imageframe"><img src="${img(k)}" alt="${photoAlt(k)}"/><span class="imgcredit">${credit(k)}</span></div><div class="bodycard"><h3>${s.n===1?'Beyond revenue generation':'Closing assessment'}</h3><p>${escapeHtml(claim)}</p>${quoteBand(s)}</div></div>`)}
function render(s){
if(s.n===1||s.n===9)return staticSlide(s);
let cards=s.cases||s.modes||[];
if(s.n===2||s.n===6||s.n===8){let k=s.imagekeys?.[0];return base(s,`<div class="sideGrid"><div class="bigphoto imageframe"><img src="${img(k)}" alt="${photoAlt(k)}"/><span class="imgcredit">${credit(k)}</span></div><div class="sideRight">${tiles(s,cards,true)}${reveal(s)}</div></div>${quoteBand(s)}`)}
let visual=[3,4,5].includes(s.n);
let controls=s.n===7?`<div class="segment"><button aria-pressed="${assessmentMode==='evidence'}" onclick="setMode('evidence')">Shelley’s evidence</button><button aria-pressed="${assessmentMode==='body'}" onclick="setMode('body')">My assessment</button></div>`:'';
return base(s,`${visual?imageCards(s,cards):tiles(s,cards)}${controls}${reveal(s)}${quoteBand(s)}`);
}
function renderStage(){let s=slides[slideIndex];$('stage').innerHTML=render(s);$('count').textContent=`Slide ${s.n} of 9 · ${s.title}`;$('slideSelect').value=String(slideIndex);$('prev').disabled=slideIndex===0;$('next').disabled=slideIndex===8;
}
window.choose=i=>{let s=slides[slideIndex];chosen[s.n]=i;renderStage();let d=$('dynamic');if(d){d.classList.remove('fade');void d.offsetWidth;d.classList.add('fade');}}
window.setMode=v=>{assessmentMode=v;renderStage()}
function setSlide(i){slideIndex=Math.max(0,Math.min(slides.length-1,i));renderStage()}
function init(){for(let i=0;i<9;i++){let o=document.createElement('option');o.value=String(i);o.textContent=`${i+1}. ${slides[i].title}`;$('slideSelect').append(o)}$('slideSelect').addEventListener('change',e=>setSlide(Number(e.target.value)));$('prev').onclick=()=>setSlide(slideIndex-1);$('next').onclick=()=>setSlide(slideIndex+1);$('full').onclick=()=>{$('stage').requestFullscreen?.()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')setSlide(slideIndex+1);if(e.key==='ArrowLeft')setSlide(slideIndex-1);});renderStage();}
init();
</script></body></html>
