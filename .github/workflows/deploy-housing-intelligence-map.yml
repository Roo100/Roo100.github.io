name: Deploy NYC Housing Intelligence Map

on:
  push:
    branches:
      - main
      - add-category-filters-20260712
    paths:
      - .github/workflows/deploy-housing-intelligence-map.yml
      - housing-map-build/build_map.py
      - housing-map-build/template.part*
      - housing-map-build/apply_category_filters.py
      - housing-map-build/apply_popup_override.py
      - housing-map-build/popup-five-covariates.html
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-housing-intelligence-map-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boundary dependencies
        run: python -m pip install --upgrade pip geopandas geodatasets pyogrio

      - name: Download verified official housing-data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf housing-map-artifact housing-map-unpacked
          mkdir -p housing-map-artifact
          gh run download 29158370610 \
            --repo Roo100/Roo100.github.io \
            --name nyc-housing-official-data \
            --dir housing-map-artifact
          find housing-map-artifact -maxdepth 2 -type f -print

      - name: Build production housing map
        run: python housing-map-build/build_map.py

      - name: Add citywide category-filter snapshot
        run: python housing-map-build/apply_category_filters.py

      - name: Apply prominent five-covariate popup
        run: python housing-map-build/apply_popup_override.py

      - name: Validate generated page
        run: |
          test -s nyc-housing-intelligence-map/index.html
          grep -q 'NYC Housing Intelligence Map' nyc-housing-intelligence-map/index.html
          grep -q 'COMPRESSED_HOUSING_DATA' nyc-housing-intelligence-map/index.html
          grep -q 'Earliest open NOV issued' nyc-housing-intelligence-map/index.html
          grep -q 'api.censusreporter.org' nyc-housing-intelligence-map/index.html
          grep -q 'Housing covariate profile' nyc-housing-intelligence-map/index.html
          grep -q 'View complete property profile' nyc-housing-intelligence-map/index.html
          grep -q 'Filter by housing categories' nyc-housing-intelligence-map/index.html
          grep -q 'violationCategoryFilter' nyc-housing-intelligence-map/index.html
          grep -q 'portfolioCategoryFilter' nyc-housing-intelligence-map/index.html
          grep -q 'evictionCategoryFilter' nyc-housing-intelligence-map/index.html
          grep -q 'OPEN_TOTAL:26' nyc-housing-intelligence-map/index.html
          grep -q 'categoryFilterMatches' nyc-housing-intelligence-map/index.html
          test -s nyc-housing-intelligence-map-cover.svg
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import json
          import re
          text = Path('nyc-housing-intelligence-map/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', text, flags=re.S)
          assert len(scripts) >= 3
          Path('/tmp/housing-map-app.js').write_text(scripts[-2], encoding='utf-8')
          Path('/tmp/housing-map-popup.js').write_text(scripts[-1], encoding='utf-8')
          assert text.count('window.COMPRESSED_HOUSING_DATA=') == 1
          assert text.count('FIVE_COVARIATE_POPUP_START') == 1
          match = re.search(r'window\.COMPRESSED_HOUSING_DATA="([^"]+)";', text)
          payload = json.loads(gzip.decompress(base64.b64decode(match.group(1))))
          assert len(payload['rows']) >= 46000
          assert min(len(row) for row in payload['rows']) >= 33
          assert payload['manifest']['category_filter_status'] == 'bundled_citywide_snapshot'
          assert 'nyc-housing-intelligence-map/' in Path('index.html').read_text(encoding='utf-8')
          PY
          node --check /tmp/housing-map-app.js
          node --check /tmp/housing-map-popup.js

      - name: Commit generated deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nyc-housing-intelligence-map/index.html \
                  nyc-housing-intelligence-map/.nojekyll \
                  nyc-housing-intelligence-map-cover.svg \
                  index.html
          if git diff --cached --quiet; then
            echo 'No deployment changes to commit.'
            exit 0
          fi
          git commit -m 'Deploy category filters for housing map'
          git push origin HEAD:${{ github.ref_name }}
