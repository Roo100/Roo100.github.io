name: Rename college project to My College Launchpad

on:
  push:
    paths:
      - '.github/workflows/rename-to-my-college-launchpad.yml'

permissions:
  contents: write

jobs:
  rename-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project under new folder and title
        shell: bash
        run: |
          set -euo pipefail

          OLD_URL="https://roo100.github.io/pathway-to-college"
          NEW_DIR="my-college-launchpad"

          rm -rf "$NEW_DIR"
          mkdir -p "$NEW_DIR"

          files=(
            index.html
            college-list.html
            my-plan.html
            college-journey.html
            paying-for-college.html
            about.html
            styles.css
            common.js
            college-list.js
            my-plan.js
            college-journey.js
            paying.js
            translations.js
          )

          for file in "${files[@]}"; do
            curl --fail --location --silent --show-error \
              "$OLD_URL/$file" \
              --output "$NEW_DIR/$file"
          done

          find "$NEW_DIR" -type f -print0 | xargs -0 sed -i \
            -e 's/Pathway to College/My College Launchpad/g' \
            -e 's/pathway-to-college/my-college-launchpad/g'

          cat > "$NEW_DIR/README.md" <<'EOF'
          # My College Launchpad — Student-Forward Multilingual Prototype

          This version is designed for undocumented and immigrant students preparing for college.

          ## Pages
          - `index.html` — student entry points
          - `college-list.html` — searchable college list builder and comparison
          - `my-plan.html` — personal action plan connected to the saved college list
          - `college-journey.html` — interactive timeline
          - `paying-for-college.html` — student financial-planning guide
          - `about.html` — project purpose, privacy, and prototype notice

          ## Languages
          English, Spanish, Simplified Chinese, Bangla, Haitian Creole, and Korean.

          ## Privacy
          The prototype does not request a name, address, or immigration status. Saved information remains in the browser on the device being used.
          EOF

          touch "$NEW_DIR/.nojekyll"
          rm -rf pathway-to-college
          rm -f .github/workflows/rename-to-my-college-launchpad.yml

      - name: Commit renamed project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Pathway to College as My College Launchpad" || exit 0
          git push
