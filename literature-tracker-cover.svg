<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" role="img" aria-labelledby="title desc">
  <title id="title">Beyond the Wall research project cover</title>
  <desc id="desc">Academic public-facing research cover for Beyond the Wall, focused on Black motherhood after incarceration, reentry, and abolitionist practices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfbf8"/>
      <stop offset="1" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#183554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f1b2d" flood-opacity="0.14"/>
    </filter>
    <style>
      .small{font:600 18px Inter, Arial, sans-serif;letter-spacing:6px;fill:#0f1b2d;}
      .title{font:800 76px Inter, Arial, sans-serif;letter-spacing:1px;fill:#0f1b2d;}
      .subtitle{font:800 36px Inter, Arial, sans-serif;letter-spacing:3px;fill:#d6a315;}
      .line{stroke:#0f1b2d;stroke-width:3;opacity:.8;}
      .body{font:500 22px Inter, Arial, sans-serif;fill:#263243;}
      .label{font:700 16px Inter, Arial, sans-serif;letter-spacing:1px;fill:#0f1b2d;}
      .caption{font:600 13px Inter, Arial, sans-serif;letter-spacing:1.5px;fill:#4d5a6a;}
      .gold{fill:#d6a315;}
      .navyfill{fill:#0f1b2d;}
      .muted{fill:#dfe5ec;}
      .panel{fill:#fff;stroke:#dbe2ea;stroke-width:1.5;}
      .grid{stroke:#d6dde6;stroke-width:1;opacity:.85;}
      .axis{stroke:#0f1b2d;stroke-width:2;}
    </style>
  </defs>

  <rect width="1200" height="514" rx="0" fill="url(#bg)"/>
  <rect x="0" y="468" width="1200" height="46" fill="#0f1b2d" opacity=".98"/>
  <circle cx="790" cy="184" r="182" fill="#eef1f5" opacity=".85"/>
  <circle cx="985" cy="116" r="86" fill="#d6a315" opacity=".16"/>
  <circle cx="1010" cy="350" r="116" fill="#0f1b2d" opacity=".07"/>

  <g transform="translate(42 42)">
    <text class="small" x="0" y="0" dominant-baseline="hanging">RESEARCH PROJECT</text>
    <rect x="0" y="34" width="72" height="5" fill="#d6a315"/>
    <text class="title" x="0" y="106">BEYOND</text>
    <text class="title" x="0" y="186">THE WALL</text>
    <line class="line" x1="0" y1="214" x2="455" y2="214"/>
    <text class="subtitle" x="0" y="270">BLACK MOTHERHOOD</text>
    <text class="subtitle" x="0" y="318">AFTER INCARCERATION</text>
    <text class="body" x="0" y="374">Autoethnography, reentry, and abolitionist practices.</text>
  </g>

  <g transform="translate(568 46)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="540" height="386" rx="24"/>
    <g opacity=".9">
      <line class="grid" x1="42" y1="70" x2="498" y2="70"/><line class="grid" x1="42" y1="122" x2="498" y2="122"/><line class="grid" x1="42" y1="174" x2="498" y2="174"/><line class="grid" x1="42" y1="226" x2="498" y2="226"/><line class="grid" x1="42" y1="278" x2="498" y2="278"/>
      <line class="grid" x1="104" y1="38" x2="104" y2="314"/><line class="grid" x1="178" y1="38" x2="178" y2="314"/><line class="grid" x1="252" y1="38" x2="252" y2="314"/><line class="grid" x1="326" y1="38" x2="326" y2="314"/><line class="grid" x1="400" y1="38" x2="400" y2="314"/>
    </g>

    <g transform="translate(58 62)">
      <text class="caption" x="0" y="0">SOURCE THEMES</text>
      <rect x="0" y="34" width="58" height="144" rx="6" fill="#dfe5ec"/><rect x="0" y="94" width="58" height="84" rx="6" fill="#0f1b2d"/>
      <rect x="82" y="12" width="58" height="166" rx="6" fill="#dfe5ec"/><rect x="82" y="70" width="58" height="108" rx="6" fill="#0f1b2d"/>
      <rect x="164" y="-8" width="58" height="186" rx="6" fill="#dfe5ec"/><rect x="164" y="42" width="58" height="136" rx="6" fill="#0f1b2d"/>
      <rect x="246" y="-30" width="58" height="208" rx="6" fill="#dfe5ec"/><rect x="246" y="16" width="58" height="162" rx="6" fill="#0f1b2d"/>
      <polyline points="0,152 82,118 164,102 246,42 304,8" fill="none" stroke="#d6a315" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="152" r="7" class="gold"/><circle cx="82" cy="118" r="7" class="gold"/><circle cx="164" cy="102" r="7" class="gold"/><circle cx="246" cy="42" r="7" class="gold"/><circle cx="304" cy="8" r="7" class="gold"/>
      <line class="axis" x1="-2" y1="180" x2="326" y2="180"/>
    </g>

    <g transform="translate(382 48)">
      <circle cx="58" cy="58" r="58" fill="#0f1b2d"/>
      <path d="M32 32h42v54H32z" fill="none" stroke="#fff" stroke-width="6" rx="4"/>
      <path d="M42 48h24M42 62h24M42 76h16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="78" cy="80" r="22" fill="none" stroke="#fff" stroke-width="6"/>
      <path d="M94 96l18 18" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g transform="translate(60 318)">
      <text class="label" x="0" y="0">LIVED EXPERIENCE</text>
      <text class="label" x="175" y="0">RESEARCH DATA</text>
      <text class="label" x="340" y="0">ABOLITION</text>
    </g>
  </g>

  <g transform="translate(55 470)">
    <text x="0" y="30" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#fff">RESEARCH &amp; LITERATURE</text>
    <text x="300" y="30" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#fff">VOICES &amp; NARRATIVES</text>
    <text x="625" y="30" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#fff">DATA &amp; INSIGHTS</text>
    <text x="895" y="30" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#fff">PRACTICE &amp; CHANGE</text>
  </g>
</svg>
