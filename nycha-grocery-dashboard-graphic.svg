<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" role="img" aria-labelledby="title desc">
  <title id="title">NYCHA Grocery Proximity Dashboard Preview</title>
  <desc id="desc">Stylized preview graphic showing NYCHA housing points connected to nearby grocery points with summary panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f4ec"/>
      <stop offset="100%" stop-color="#ece5d8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f2ecdf"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f5d80"/>
      <stop offset="100%" stop-color="#b98c43"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#101826" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1680" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1624" height="664" rx="26" fill="url(#panel)" stroke="#d9d2c6"/>

  <rect x="64" y="72" width="620" height="576" rx="20" fill="#0f1b2d" opacity="0.96"/>
  <text x="108" y="150" fill="#f7f2e8" font-family="Cormorant Garamond, Georgia, serif" font-size="68" font-weight="600">
    NYCHA Grocery
  </text>
  <text x="108" y="218" fill="#f7f2e8" font-family="Cormorant Garamond, Georgia, serif" font-size="68" font-weight="600">
    Proximity Dashboard
  </text>
  <text x="108" y="292" fill="#c8d1de" font-family="Inter, Arial, sans-serif" font-size="28">
    Public housing + food access in NYC
  </text>

  <rect x="108" y="334" width="530" height="136" rx="16" fill="#f8f4ec" opacity="0.12" stroke="#ccd4e0"/>
  <text x="136" y="382" fill="#f4efe5" font-family="Inter, Arial, sans-serif" font-size="22">
    Nearest grocery distance by development
  </text>
  <text x="136" y="420" fill="#f4efe5" font-family="Inter, Arial, sans-serif" font-size="22">
    Income and race neighborhood context
  </text>
  <text x="136" y="458" fill="#f4efe5" font-family="Inter, Arial, sans-serif" font-size="22">
    Side-by-side development comparison
  </text>

  <g transform="translate(730 84)">
    <rect width="886" height="552" rx="20" fill="#ffffff" stroke="#d8d1c4" filter="url(#softShadow)"/>

    <rect x="24" y="24" width="552" height="504" rx="16" fill="#f5f1e8" stroke="#d9d3c8"/>
    <g opacity="0.62" stroke="#d2cabb" stroke-width="2">
      <path d="M52 76 H548"/>
      <path d="M52 118 H548"/>
      <path d="M52 160 H548"/>
      <path d="M52 202 H548"/>
      <path d="M52 244 H548"/>
      <path d="M52 286 H548"/>
      <path d="M52 328 H548"/>
      <path d="M52 370 H548"/>
      <path d="M52 412 H548"/>
      <path d="M52 454 H548"/>
      <path d="M78 56 V486"/>
      <path d="M138 56 V486"/>
      <path d="M198 56 V486"/>
      <path d="M258 56 V486"/>
      <path d="M318 56 V486"/>
      <path d="M378 56 V486"/>
      <path d="M438 56 V486"/>
      <path d="M498 56 V486"/>
    </g>

    <g>
      <circle cx="168" cy="176" r="12" fill="#b98c43" stroke="#fffdf7" stroke-width="3"/>
      <circle cx="314" cy="248" r="12" fill="#b98c43" stroke="#fffdf7" stroke-width="3"/>
      <circle cx="214" cy="356" r="12" fill="#b98c43" stroke="#fffdf7" stroke-width="3"/>

      <circle cx="242" cy="130" r="10" fill="#3f5d80" stroke="#fffdf7" stroke-width="3"/>
      <circle cx="388" cy="202" r="10" fill="#3f5d80" stroke="#fffdf7" stroke-width="3"/>
      <circle cx="290" cy="314" r="10" fill="#3f5d80" stroke="#fffdf7" stroke-width="3"/>

      <line x1="168" y1="176" x2="242" y2="130" stroke="url(#line)" stroke-width="4" stroke-dasharray="8 8"/>
      <line x1="314" y1="248" x2="388" y2="202" stroke="url(#line)" stroke-width="4" stroke-dasharray="8 8"/>
      <line x1="214" y1="356" x2="290" y2="314" stroke="url(#line)" stroke-width="4" stroke-dasharray="8 8"/>
    </g>

    <g transform="translate(600 24)">
      <rect width="262" height="154" rx="14" fill="#f8f4ec" stroke="#d8d2c6"/>
      <text x="16" y="42" fill="#5b6678" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Mapped Developments</text>
      <text x="16" y="98" fill="#0f1b2d" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700">208</text>
    </g>

    <g transform="translate(600 194)">
      <rect width="262" height="154" rx="14" fill="#f8f4ec" stroke="#d8d2c6"/>
      <text x="16" y="42" fill="#5b6678" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Median Distance</text>
      <text x="16" y="98" fill="#0f1b2d" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700">0.14 mi</text>
    </g>

    <g transform="translate(600 364)">
      <rect width="262" height="164" rx="14" fill="#f8f4ec" stroke="#d8d2c6"/>
      <text x="16" y="42" fill="#5b6678" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Avg 4-Item Price</text>
      <text x="16" y="100" fill="#0f1b2d" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="700">$4.95</text>
      <text x="16" y="136" fill="#5f6775" font-family="Inter, Arial, sans-serif" font-size="18">Eggs, milk, bread, chicken</text>
    </g>
  </g>
</svg>
