  <image href="base-map.png" x="980" y="150" width="620" height="430" opacity="0.30" preserveAspectRatio="xMidYMid slice"/>

  <rect x="98" y="86" width="960" height="548" rx="28" fill="url(#panel)" stroke="#d9e6ec"/>

  <text x="152" y="154" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f7f7a" letter-spacing="1.5">PUBLIC RESEARCH DASHBOARD</text>

  <text x="152" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#172f4a">NYS DOCCS</text>
