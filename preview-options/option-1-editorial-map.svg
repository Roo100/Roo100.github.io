  </defs>

  <image href="base-map.png" x="0" y="0" width="1680" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1680" height="720" fill="url(#wash)"/>
  <rect x="0" y="0" width="1080" height="720" fill="url(#leftFade)"/>

  <rect x="82" y="84" width="232" height="34" rx="17" fill="#ffffff" opacity="0.92"/>
