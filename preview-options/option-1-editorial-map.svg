<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="720" viewBox="0 0 1680 720">
  <defs>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7f5f0" stop-opacity="0.96"/>
      <stop offset="45%" stop-color="#f7f5f0" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#f7f5f0" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7edf0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
