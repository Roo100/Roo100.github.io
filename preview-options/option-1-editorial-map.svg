  <text x="86" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#172f4a">NYS DOCCS</text>
  <text x="86" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#172f4a">Recidivism Dashboard</text>

  <text x="90" y="352" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#4f6478">County rates, cohort trends, and facility context</text>

  <line x1="90" y1="392" x2="724" y2="392" stroke="#5fb7ad" stroke-width="3" opacity="0.8"/>

  <rect x="86" y="432" width="468" height="146" rx="16" fill="#ffffff" opacity="0.88" stroke="#d9e6ec"/>
  <text x="114" y="476" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#172f4a">Interactive findings by release cohort</text>
